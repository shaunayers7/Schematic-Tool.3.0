<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17231f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Electric Boyes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="app/icon.svg">
  <link rel="stylesheet" href="app/launcher.css">
  <title>Electric Boyes | Worksite Hub</title>
  <script defer src="app/catalog.js"></script>
  <script defer src="app/hub.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Electric Boyes app home">
        <span class="brand-mark" aria-hidden="true">EB</span>
        <span class="brand-name">ELECTRIC BOYES</span>
      </a>
      <div class="topbar-actions">
        <div id="connectionStatus" class="connection-status" role="status" aria-live="polite">
          <span class="status-light" aria-hidden="true"></span><span id="connectionLabel">ONLINE</span>
        </div>
        <button id="installButton" class="install-button" type="button" hidden>Install</button>
      </div>
    </header>

    <main class="main-area">
      <section id="homeView" class="home-view" aria-labelledby="homeTitle">
        <div class="screen-heading">
          <div class="screen-eyebrow">ELECTRIC BOYES <span>WORKSITE</span></div>
          <h1 id="homeTitle">Your apps</h1>
          <p>Work tools, ready when you are.</p>
        </div>
        <label class="search-box" for="appSearch">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="appSearch" type="search" placeholder="Search apps" autocomplete="off">
        </label>
        <div id="appGrid" class="app-grid" aria-live="polite"></div>
        <p id="emptySearch" class="empty-search" hidden>No apps match that search.</p>
        <div class="home-dock">
          <span class="dock-mark" aria-hidden="true">EB</span>
          <span>FIELD TOOLS</span>
          <span class="dock-divider"></span>
          <span id="appCount">01 APP</span>
        </div>
      </section>

      <section id="appView" class="app-view" aria-labelledby="appTitle" hidden>
        <div class="screen-toolbar">
          <button id="appBackButton" class="back-button" type="button"><span aria-hidden="true">&#8249;</span> Apps</button>
          <span class="screen-toolbar-label">APP MODULES</span>
          <span class="toolbar-spacer" aria-hidden="true"></span>
        </div>
        <div class="app-identity">
          <span id="activeAppIcon" class="app-icon large" aria-hidden="true"></span>
          <div>
            <div id="activeAppCategory" class="screen-eyebrow">WORK TOOL</div>
            <h1 id="appTitle">Schematic Tool</h1>
            <p id="appDescription"></p>
          </div>
        </div>
        <div class="section-heading"><h2>Modules</h2><span id="moduleCount">01</span></div>
        <div id="moduleGrid" class="module-grid" aria-live="polite"></div>
        <a class="add-module-link" href="README.md#adding-a-tool"><span aria-hidden="true">+</span> Add a module</a>
      </section>

      <section id="toolView" class="tool-view" aria-label="Selected module" hidden>
        <div class="tool-toolbar">
          <button id="moduleBackButton" class="back-button" type="button"><span aria-hidden="true">&#8249;</span><span id="moduleBackLabel">Schematic Tool</span></button>
          <div class="tool-location"><span id="activeToolName">SCHEMATIC TAKEOFF</span></div>
          <span class="local-save-label"><span class="save-dot"></span> ON THIS DEVICE</span>
        </div>
        <iframe id="toolFrame" title="Selected worksite module" allow="clipboard-read; clipboard-write" loading="eager"></iframe>
      </section>
    </main>
  </div>
</body>
</html>
